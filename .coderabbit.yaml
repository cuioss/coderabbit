# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# Central CodeRabbit configuration for the cuioss organization.
# Applies to every cuioss repository that does NOT have its own .coderabbit.yaml.
# (A repository-level .coderabbit.yaml fully overrides this file unless it sets
#  `inheritance: true`.)
#
# Rationale for every setting: https://github.com/cuioss/cuioss-organization/blob/main/docs/automatic-review/coderabbit.md
reviews:
  # Balanced profile. It still surfaces nitpick comments, which we treat as
  # signal (see the signal/noise doc). `quiet` would drop them; `assertive`
  # would add more feedback (and more noise).
  profile: chill

  # --- Noise reduction (see doc §"Reduced via config") ---
  sequence_diagrams: false        # auto UML rarely adds value for our changes
  suggested_labels: false         # not part of our workflow
  suggested_reviewers: false      # single-maintainer org
  poem: false                     # (default) no poem
  in_progress_fortune: false      # no "fortune" chatter while a review runs

  # Keep the "Prompt for AI Agents" block: it is the machine-readable payload
  # our automation (plan-marshall) ingests. (Default true; set explicitly.)
  enable_prompt_for_ai_agents: true

  # Drop the interactive "Finishing Touches" checkboxes (docstring / unit-test
  # generators) — UI, not review findings.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  # Silence always-skipped pre-merge checks: no functions -> docstring coverage
  # is N/A; no linked issues -> issue assessment is N/A.
  pre_merge_checks:
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"

  # --- Review instructions ---
  #
  # Targets one archetype the reviewer ensemble demonstrably misses: a change that reads
  # as internally consistent because the claim it makes and the mechanism that would
  # implement the claim live in different files, and only one of them is in the diff.
  #
  # Concrete case (API-Sheriff#123): the change documented two benchmark goals as
  # "deliberately skipped", gave a reason for each, and dropped both from a new CI
  # coverage list — while both remained unconditional executions in a `pom.xml` the
  # change never touched. Read as a document it was coherent: twelve wired, two skipped,
  # ten expected. Every automated reviewer returned a clean result. CodeRabbit is the
  # only one of them with whole-repository context, so it is the only one that can close
  # this; it had the access and no reason to use it.
  #
  # Scoped to every file on purpose. The claim can appear in a workflow, a document or a
  # source comment, and the mechanism is wherever it happens to be — narrowing the glob
  # would reintroduce the blind spot on whichever surface got left out.
  path_instructions:
    - path: "**/*"
      instructions: >-
        When a change states that something is skipped, disabled, guarded, validated,
        enforced or removed, verify that the mechanism exists in the file that would have
        to implement it — build file, CI configuration, or source — including files this
        pull request does not modify. Report a stated behaviour whose mechanism is absent,
        and name the file that would have to contain it. Prose, a code comment, or a
        summary table is not a mechanism.

        Treat a hardcoded list that must mirror a set defined elsewhere — build goals, enum
        constants, registered handlers, dispatch tables — as a defect unless it is derived
        from that source at build or run time. Name the authoritative definition and the
        drift it permits.

        Check a guard's predicate against the scenario the guard exists for. Report a
        condition that cannot fire in that scenario, or that an earlier failure path
        suppresses before it is reached.

  auto_review:
    # Manual opt-out: add the `skip-bot-review` label to any PR to skip its
    # automatic review. All other PRs are still reviewed (auto-review stays on).
    # (Shared bot-skip label; Sourcery/Gemini honoring is documented in the org
    #  automatic-review docs — CodeRabbit is the only bot that honors it centrally.)
    labels:
      - "!skip-bot-review"
    # Skip automatic reviews for bot-authored dependency/propagation PRs — these
    # are gated by CI and auto-merge and do not need CodeRabbit review:
    #   - dependabot[bot]:        Dependabot dependency bumps
    #   - cuioss-release-bot[bot]: consumer-propagation PRs opened by the release
    #     App (parent-version bumps from a consumer list, org-workflow SHA bumps)
    ignore_usernames:
      - "dependabot[bot]"
      - "cuioss-release-bot[bot]"

    # Review once when the PR opens; do NOT re-review on every push.
    #
    # The review quota is per-developer over a rolling window, and this repository
    # exhausts it chronically: #1041, #1043 and #1044 all received
    # "you've reached your PR review limit, so we couldn't start this review" and
    # were never reviewed. #1044 then MERGED with no CodeRabbit review at all.
    #
    # ⚠ Measure review rounds correctly. The GitHub reviews API counts a threaded
    # reply to a comment as a review submission, so a naive count is inflated
    # several-fold: #1027 shows 18 submissions but ran 3 real review rounds, and
    # #1042 shows 11 submissions for 3 rounds. Filter on a review body containing
    # "Actionable comments posted" / "No actionable comments" / "Review limit
    # reached". The real figure is roughly 1-3 rounds per pull request; what
    # exhausts the quota here is PULL REQUEST VOLUME (about 20 merged in two days),
    # not per-PR incremental depth.
    #
    # So this setting removes ONE round per pull request, not a runaway. It is
    # worth it because of WHICH round it removes — see below.
    #
    # Intermediate heads are not what we need reviewed. plan-marshall requests a
    # review of the near-final tree explicitly, by posting this bot's registered
    # trigger_comment (`@coderabbitai review`) after branch-cleanup rebases and
    # force-pushes the feature branch onto base — the `re_review_on_branch_cleanup`
    # knob, default ON, and the last re-review trigger in the flow. See
    # automatic-review/standards/coderabbit.md and
    # workflow-integration-github/scripts/github_re_review.py.
    #
    # (The OTHER re-review trigger, `re_review_on_loopback`, is default-OFF and is
    #  off in plan-marshall's own marshal.json — it is NOT what backs this change.
    #  Do not cite it as the mechanism.)
    #
    # Automatic incremental review duplicates the branch-cleanup request at
    # arbitrary intermediate points and spends the quota that request needs.
    #
    # #1042 shows which round carries the value, and it is not the incremental one:
    #
    #   round 1  20:39  automatic, on open   3 findings — BOTH that were fixed
    #                                        (TASK-008 registry, TASK-7 scoping)
    #   round 2  21:41  automatic INCREMENTAL  3 findings — all valid, all declined
    #                                          as nits with no functional impact
    #   round 3  05:01  explicit @coderabbitai review  1 finding
    #
    # Only round 2 is removed here. The opening review is untouched, and an
    # explicitly requested review is untouched. On this pull request the removed
    # round produced nothing that was acted on.
    #
    # ⚠ One round is a sample, not a law. If a later pull request has an
    # incremental round produce a finding that gets FIXED, that is evidence against
    # this setting — record it rather than assuming this generalises.
    auto_incremental_review: false
